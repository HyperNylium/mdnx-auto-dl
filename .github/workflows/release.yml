name: Build image on Release
run-name: "Build Docker image for ${{ github.event.release.name }}"

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      IMAGE: ${{ steps.vars.outputs.IMAGE }}
      VERSION: ${{ steps.vars.outputs.VERSION }}
      CREATED: ${{ steps.vars.outputs.CREATED }}
      REF_NAME: ${{ steps.vars.outputs.REF_NAME }}
    steps:
      - name: Compute image/tag vars
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "REF_NAME=${GITHUB_REF}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest (${{ matrix.arch }})
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          no-cache: true
          outputs: type=image,name=${{ needs.prepare.outputs.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.CREATED }}
            org.opencontainers.image.ref.name=${{ needs.prepare.outputs.REF_NAME }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.VERSION }}

      - name: Save digest
        shell: bash
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*

  merge:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.VERSION }}
          TITLE: ${{ github.event.repository.name }}
          DESCRIPTION: ${{ github.event.repository.description }}
          SOURCE_URL: ${{ github.event.repository.html_url }}
          LICENSES: ${{ github.event.repository.license.spdx_id }}
          CREATED: ${{ needs.prepare.outputs.CREATED }}
          REF_NAME: ${{ needs.prepare.outputs.REF_NAME }}
        run: |
          set -euo pipefail
          SOURCES=()
          for DIGEST_FILE in "${RUNNER_TEMP}"/digests/*; do
            SOURCES+=("${IMAGE}@sha256:$(basename "${DIGEST_FILE}")")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --annotation "index:org.opencontainers.image.title=${TITLE}" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "index:org.opencontainers.image.licenses=${LICENSES}" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            --annotation "index:org.opencontainers.image.ref.name=${REF_NAME}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${SOURCES[@]}"

          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create release checksum file
        shell: bash
        run: |
          DIGEST="${{ steps.manifest.outputs.DIGEST }}"
          {
            echo "image=${{ needs.prepare.outputs.IMAGE }}"
            echo "tag=${{ needs.prepare.outputs.VERSION }}"
            echo "latest=true"
            echo "digest=${DIGEST}"
          } > release-sha256.txt
          echo "Wrote release-sha256.txt:"
          cat release-sha256.txt

      - name: Upload checksum to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
