name: Build image on Release
run-name: "Build Docker image for ${{ github.event.release.name }}"

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      IMAGE: ${{ steps.vars.outputs.IMAGE }}
      VERSION: ${{ steps.vars.outputs.VERSION }}
      CREATED: ${{ steps.vars.outputs.CREATED }}
      REF_NAME: ${{ steps.vars.outputs.REF_NAME }}
    steps:
      - name: Compute image/tag vars
        id: vars
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "REF_NAME=${GITHUB_REF}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest (${{ matrix.arch }})
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          no-cache: true
          outputs: type=image,name=${{ needs.prepare.outputs.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.CREATED }}
            org.opencontainers.image.ref.name=${{ needs.prepare.outputs.REF_NAME }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.VERSION }}

      - name: Save digest
        shell: bash
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*

  merge:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.IMAGE }}
          VERSION: ${{ needs.prepare.outputs.VERSION }}
          TITLE: ${{ github.event.repository.name }}
          DESCRIPTION: ${{ github.event.repository.description }}
          SOURCE_URL: ${{ github.event.repository.html_url }}
          LICENSES: ${{ github.event.repository.license.spdx_id }}
          CREATED: ${{ needs.prepare.outputs.CREATED }}
          REF_NAME: ${{ needs.prepare.outputs.REF_NAME }}
        run: |
          set -euo pipefail
          SOURCES=()
          for DIGEST_FILE in "${RUNNER_TEMP}"/digests/*; do
            SOURCES+=("${IMAGE}@sha256:$(basename "${DIGEST_FILE}")")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --annotation "index:org.opencontainers.image.title=${TITLE}" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "index:org.opencontainers.image.licenses=${LICENSES}" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            --annotation "index:org.opencontainers.image.ref.name=${REF_NAME}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${SOURCES[@]}"

          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create release checksum file
        shell: bash
        run: |
          DIGEST="${{ steps.manifest.outputs.DIGEST }}"
          {
            echo "image=${{ needs.prepare.outputs.IMAGE }}"
            echo "tag=${{ needs.prepare.outputs.VERSION }}"
            echo "latest=true"
            echo "digest=${DIGEST}"
          } > release-sha256.txt
          echo "Wrote release-sha256.txt:"
          cat release-sha256.txt

      - name: Upload checksum to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
