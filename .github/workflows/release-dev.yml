name: Build dev image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      IMAGE: ${{ steps.vars.outputs.IMAGE }}
      SHA: ${{ steps.vars.outputs.SHA }}
      CREATED: ${{ steps.vars.outputs.CREATED }}
      REF_NAME: ${{ steps.vars.outputs.REF_NAME }}
      DEV_TAG: ${{ steps.next.outputs.DEV_TAG }}
    steps:
      - name: Compute image vars
        id: vars
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_LC="${GITHUB_REPOSITORY,,}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          PKG_NAME="${GITHUB_REPOSITORY#*/}"
          PKG_LC="${PKG_NAME,,}"
          echo "IMAGE=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "OWNER=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "PKG=${PKG_LC}" >> "$GITHUB_OUTPUT"
          echo "SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/dev" --jq '.sha')" >> "$GITHUB_OUTPUT"
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "REF_NAME=refs/heads/dev" >> "$GITHUB_OUTPUT"

      - name: Determine next dev tag
        id: next
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ steps.vars.outputs.OWNER }}"
          PKG="${{ steps.vars.outputs.PKG }}"

          get_versions() {
            gh api -H "Accept: application/vnd.github+json" "/orgs/${OWNER}/packages/container/${PKG}/versions?per_page=100" 2>/dev/null || \
            gh api -H "Accept: application/vnd.github+json" "/users/${OWNER}/packages/container/${PKG}/versions?per_page=100" 2>/dev/null || true
          }

          TAGS=$(get_versions | jq -r '.[]?.metadata.container.tags[]?' || true)
          LAST_NUM=$(printf "%s\n" "$TAGS" | sed -n 's/^dev-\([0-9]\+\)$/\1/p' | sort -n | tail -1 || true)

          if [[ -z "${LAST_NUM:-}" ]]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_NUM + 1))
          fi

          echo "DEV_TAG=dev-${NEXT_NUM}" >> "$GITHUB_OUTPUT"
          echo "Next dev tag: dev-${NEXT_NUM}"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest (${{ matrix.arch }})
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          no-cache: true
          outputs: type=image,name=${{ needs.prepare.outputs.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.CREATED }}
            org.opencontainers.image.ref.name=${{ needs.prepare.outputs.REF_NAME }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.DEV_TAG }}

      - name: Save digest
        shell: bash
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*

  merge:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.IMAGE }}
          DEV_TAG: ${{ needs.prepare.outputs.DEV_TAG }}
          TITLE: ${{ github.event.repository.name }}
          DESCRIPTION: ${{ github.event.repository.description }}
          SOURCE_URL: ${{ github.event.repository.html_url }}
          LICENSES: ${{ github.event.repository.license.spdx_id }}
          CREATED: ${{ needs.prepare.outputs.CREATED }}
          REF_NAME: ${{ needs.prepare.outputs.REF_NAME }}
        run: |
          set -euo pipefail
          SOURCES=()
          for DIGEST_FILE in "${RUNNER_TEMP}"/digests/*; do
            SOURCES+=("${IMAGE}@sha256:$(basename "${DIGEST_FILE}")")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:dev" \
            --tag "${IMAGE}:${DEV_TAG}" \
            --annotation "index:org.opencontainers.image.title=${TITLE}" \
            --annotation "index:org.opencontainers.image.description=${DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "index:org.opencontainers.image.licenses=${LICENSES}" \
            --annotation "index:org.opencontainers.image.created=${CREATED}" \
            --annotation "index:org.opencontainers.image.ref.name=${REF_NAME}" \
            --annotation "index:org.opencontainers.image.version=${DEV_TAG}" \
            "${SOURCES[@]}"

          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${DEV_TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Summarize
        shell: bash
        run: |
          echo "Built:"
          echo "  ${{ needs.prepare.outputs.IMAGE }}:dev"
          echo "  ${{ needs.prepare.outputs.IMAGE }}:${{ needs.prepare.outputs.DEV_TAG }}"
          echo "Commit: ${{ needs.prepare.outputs.SHA }}"
          echo "Ref: ${{ needs.prepare.outputs.REF_NAME }}"
          echo "Digest: ${{ steps.manifest.outputs.DIGEST }}"
